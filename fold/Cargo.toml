[package]
name = "fold"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[dependencies]
fxhash = "0"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
fjall = { version = "3", default-features = false }
